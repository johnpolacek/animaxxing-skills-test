<!doctype html><html><head><style>
body{margin:0;font:16px sans-serif}
.grid{display:flex;flex-wrap:wrap;gap:10px;width:430px;padding:10px}
.card{width:100px;height:80px;background:#ddd}
.grid[data-filter="even"] .card:nth-child(odd){display:none}
.hidden{display:none}
#thumb{position:absolute;left:20px;top:300px;width:60px;height:40px;background:#333}
#hero{position:absolute;left:300px;top:260px;width:240px;height:160px;background:#333}
</style></head><body>
<div class="grid" id="grid">
  <div class="card" id="c1" style="outline: 1px solid red">1</div><div class="card" id="c2">2</div><div class="card" id="c3">3</div>
  <div class="card" id="c4">4</div><div class="card" id="c5">5</div><div class="card" id="c6">6</div>
</div>
<div id="thumb" data-flip-id="photo"></div>
<div id="hero" class="hidden" data-flip-id="photo"></div>
<script src="../.build/layout-flip.js"></script></body></html>
