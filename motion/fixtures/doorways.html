<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
body{margin:0;font:16px sans-serif}
.frame{position:relative;overflow:hidden}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
#frame{width:400px;height:300px;margin:20px}
#track{height:2400px;position:relative}
#stage{position:sticky;top:0;width:400px;height:300px;overflow:hidden;background:#333}
#next{position:absolute;inset:0;background:#c33}
#glow{position:absolute;background:#ff0}
#cards{position:absolute;left:480px;top:20px;display:flex;gap:20px;align-items:flex-start}
#card{width:120px;height:90px}
#arch{width:240px;height:360px}
</style></head><body>
<figure class="frame" id="frame"><img alt="A test picture"></figure>
<div id="cards"><div class="frame" id="card"><img alt="Card"></div><div class="frame" id="arch"><img alt="Arch"></div></div>
<div id="track"><div id="stage"><div id="next"></div><i id="glow"></i></div></div>
<script>
const c = document.createElement("canvas"); c.width = 160; c.height = 100;
const x = c.getContext("2d"); x.fillStyle = "#08f"; x.fillRect(0, 0, 160, 100); x.fillStyle = "#fff"; x.fillRect(70, 0, 20, 100);
for (const img of document.querySelectorAll("img")) img.src = c.toDataURL();
</script>
<script src="../.build/doorways.js"></script></body></html>
