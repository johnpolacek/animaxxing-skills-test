<!doctype html><html><head><style>
body{margin:0;font:16px sans-serif;height:2000px}
#mag{position:absolute;left:100px;top:100px;width:200px;height:80px;background:#ddd;display:block}
#card{position:absolute;left:400px;top:100px;width:200px;height:200px;background:#eee;transform:translateZ(0)}
.cursor{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;background:#000;pointer-events:none;visibility:hidden}
.drag-viewport{position:absolute;top:400px;left:0;width:800px;overflow-x:auto}.drag-track{display:flex;width:max-content;gap:10px}
.drag-track a{display:block;width:300px;height:150px;background:#ccc;flex:none}
#grow{position:absolute;left:700px;top:100px;width:50px;height:50px}
</style></head><body>
<a id="mag" href="#m"><span id="inner" data-magnetic-inner>Start</span></a>
<div id="card" style="transform: translateZ(0)">card</div>
<div id="grow" data-cursor="grow">g</div>
<div class="cursor" id="cur" aria-hidden="true"></div>
<div class="drag-viewport" id="vp"><div class="drag-track" id="tr"><a href="#a1" id="a1">1</a><a href="#a2">2</a><a href="#a3">3</a><a href="#a4">4</a><a href="#a5" id="a5">5</a></div></div>
<div id="mom" style="position:absolute;left:100px;top:600px;display:flex;gap:40px"><div data-momentum-item id="m1" style="width:60px;height:60px"><span data-momentum-target id="mt1" style="display:block;width:60px;height:60px;background:#f99"></span></div><div data-momentum-item id="m2" style="width:60px;height:60px"><span data-momentum-target id="mt2" style="display:block;width:60px;height:60px;background:#9f9"></span></div></div>
<script src="../.build/pointer-effects.js"></script></body></html>
