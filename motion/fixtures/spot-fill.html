<!doctype html><html><head><style>
body{margin:0;font:16px sans-serif}
.spot{position:absolute;left:40px;top:40px;width:400px;height:240px;background:#222;color:#fff}
.spot-reveal{position:absolute;inset:0;background:#fc0;color:#000;clip-path:circle(0px at 50% 50%)}
.tile{position:absolute;left:520px;top:40px;width:300px;height:120px;display:grid;place-items:center;isolation:isolate;border:1px solid #000}
.tile-fill{position:absolute;inset:0;z-index:-1;background:#0af;clip-path:inset(0 0 100% 0)}
#away{position:absolute;left:600px;top:500px}
</style></head><body>
<div class="spot" id="spot" tabindex="0"><div class="spot-base">Base</div><div class="spot-reveal" id="reveal" style="color:rgb(0, 0, 0)">Revealed</div></div>
<a class="tile" id="tile" href="#t"><span class="tile-fill" id="fill" aria-hidden="true"></span><span>Work</span></a>
<button id="away">away</button>
<script src="../.build/pointer-effects.js"></script>
<script>window.PE = window.P; window.gsapP = window.gsap;</script>
<script src="../.build/hover-effects.js"></script></body></html>
