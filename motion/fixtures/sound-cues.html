<!doctype html><html><head></head><body>
<button id="toggle" aria-pressed="false">Sound</button>
<script>
// A 0.2s 440Hz tone and a 1s bed as data URLs, so fetch works from file://.
function wav(seconds) {
  const rate = 8000, n = Math.round(rate * seconds), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); s(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin((i / rate) * 2 * Math.PI * 440) * 8000, true);
  let bin = ""; new Uint8Array(buf).forEach((b) => (bin += String.fromCharCode(b)));
  return "data:audio/wav;base64," + btoa(bin);
}
window.TICK = wav(0.2); window.BED = wav(1);
// Counts contexts and started sources so tests can see what played.
window.audio = { contexts: [], started: [] };
const Real = window.AudioContext;
window.AudioContext = class extends Real { constructor(...a) { super(...a); audio.contexts.push(this); } };
const start = AudioBufferSourceNode.prototype.start;
AudioBufferSourceNode.prototype.start = function (...a) { audio.started.push({ loop: this.loop, detune: this.detune.value }); return start.apply(this, a); };
</script>
<script src="../.build/sound-cues.js"></script></body></html>
