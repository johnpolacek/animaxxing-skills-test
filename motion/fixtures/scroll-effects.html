<!doctype html><html><head><style>
body{margin:0;font:20px sans-serif} section{min-height:100vh;padding:20px;border-bottom:1px solid #ccc}
.run{overflow-x:auto;min-height:auto;height:100vh}.run-track{display:flex;width:max-content;gap:20px}.run-track a{display:block;width:60vw;height:50vh;background:#eee}
</style></head><body>
<header id="hdr" style="position:fixed;top:0;left:0;right:0;height:60px;pointer-events:none;z-index:5">header</header>
<section id="top" data-nav-theme="dark"><div class="rv" id="r0">top reveal</div></section>
<section id="stmt" data-nav-theme="light"><h2 id="h">Small idea, big feeling, and a statement.</h2><div class="rv" id="r1">mid reveal</div></section>
<section id="px"><img data-parallax="-40" id="pximg" style="width:100px;height:100px;background:red"></section>
<section id="scene"><div data-step>one</div><div data-step>two</div><div data-step>three</div></section>
<section class="run" id="run"><div class="run-track" id="track"><a href="#1">1</a><a href="#2"><span data-run-drift="48" id="dr" style="display:block;width:50px;height:20px"></span>2</a><a href="#3">3</a><a href="#4" id="last">4</a></div></section>
<section><div class="rv" id="r2">bottom reveal</div><div id="skew" style="transform: translateX(3px)">skew</div></section>
<div id="plop" style="width:40px;height:40px">plop</div><footer id="foot" style="height:200px"><div data-parallax="-80" id="footin">footer</div></footer>
<div id="bar" style="height:2px;background:#000"></div>
<script src="../.build/scroll-effects.js"></script></body></html>
